name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.3.3"
      - name: Print runner diagnostics
        run: |
          echo "nproc: $(nproc 2>/dev/null || sysctl -n hw.ncpu)"
          uname -a
      - name: Run tests
        run: swift test --filter TailregCoreTests
